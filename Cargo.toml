[workspace]
resolver = "3"
members = ["crates/folitecta-core", "crates/folitecta", "crates/libxdo", "crates/notices"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/KvasFan/Folitecta"
authors = ["KvasFan"]
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = { version = "0.45", features = ["embed_image"] }
hayro = "0.8"
# Every picture format a source file or a replaced picture may come in.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff", "webp"] }
base64 = "0.22"
quick-xml = "0.41"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# The menu library of the interface toolkit links libxdo through these
# bindings; ours open the library only when it is used, so the program starts
# where it is missing (crates/libxdo).
[patch.crates-io]
libxdo = { path = "crates/libxdo" }

[workspace.lints.clippy]
collapsible_if = "allow"
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# The parts of the text recognition library that read the models (run once)
# are made small; its computing kernels (tract-linalg, tract-core) stay fast.
[profile.release.package.tract-onnx]
opt-level = "s"
[profile.release.package.tract-onnx-opl]
opt-level = "s"
[profile.release.package.tract-hir]
opt-level = "s"
[profile.release.package.tract-nnef]
opt-level = "s"
[profile.release.package.prost]
opt-level = "s"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
