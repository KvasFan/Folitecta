[package]
name = "folitecta-core"
description = "Document model, page rendering and editing operations for Folitecta"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
lopdf.workspace = true
hayro.workspace = true
image.workspace = true
# Rendered pages encoded with the fast DEFLATE of fdeflate (MIT/Apache-2.0)
png = "0.18"
# The rasterizer of hayro (MIT/Apache-2.0), with its threads: a page alone
# in the queue is drawn by several threads (rayon, crossbeam-channel,
# thread_local and ordered-channel, MIT/Apache-2.0).
vello_cpu = { version = "0.3", default-features = false, features = ["std", "png", "u8_pipeline", "multithreading"] }
# ZIP archives: DEFLATE of flate2 and the checksums of crc32fast (MIT/Apache-2.0),
# both already used by the PDF libraries
flate2 = "1"
crc32fast = "1"
# E-mail messages (MIME) read into documents (MIT/Apache-2.0); every charset
# through encoding_rs
mail-parser = { version = "0.11", features = ["full_encoding"] }
# Barcodes written and read: the Rust port of ZXing (Apache-2.0), without its
# picture loading (pages are rendered here)
rxing = { version = "0.9", default-features = false, features = ["encoders", "decoders", "full_barcode_format_support", "encoding_rs"] }
# Pages searched side by side (MIT/Apache-2.0)
rayon = "1"
# Spell checking with Hunspell dictionaries (MPL-2.0); the dictionaries are
# separate files read at run time, see dictionaries/
spellbook = "0.4"
# Text recognition: the PaddleOCR models (ocr/) run by tract, a neural
# network inference library in pure Rust (MIT/Apache-2.0)
tract-onnx = "0.21"
time.workspace = true
quick-xml.workspace = true
base64.workspace = true
# Document comparison: linear-space Myers diff with a deadline (Apache-2.0)
similar = { version = "2", default-features = false }
# Palettes of 256 colours for indexed pictures, NeuQuant (MIT)
color_quant = "1.1"
# Digital signatures (RustCrypto, MIT/Apache-2.0)
der = { version = "0.7", features = ["alloc", "oid", "std", "derive"] }
spki = { version = "0.7", features = ["alloc", "std"] }
const-oid = { version = "0.9", features = ["db"] }
x509-cert = { version = "0.2", features = ["builder", "std"] }
cms = { version = "0.2", features = ["std"] }
pkcs12 = { version = "0.1", features = ["kdf"] }
pkcs8 = { version = "0.10", features = ["encryption", "std"] }
pkcs5 = { version = "0.7", features = ["pbes2", "3des"] }
rsa = { version = "0.9", features = ["sha2", "std"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.13", features = ["ecdsa"] }
signature = "2"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
des = "0.8"
rc2 = "0.8"
cbc = { version = "0.1", features = ["std"] }
aes = "0.8"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
# Generated text beyond WinAnsi (fonts module): the TrueType reader of the
# renderer (MIT/Apache-2.0; the same version hayro uses, so nothing new is
# built), and the Unicode composition and bidirectional classes already built
# for the PDF library (MIT/Apache-2.0)
skrifa = "0.46"
unicode-normalization = "0.1"
unicode-bidi = "0.3"
# Passwords of AES-256 protection prepared as the PDF format asks (SASLprep,
# MIT/Apache-2.0), already used by the PDF library
stringprep = "0.1"
# MD5 of the password algorithms of revisions 2 to 4 (MIT/Apache-2.0), already
# used by the PDF library
md-5 = "0.11"
