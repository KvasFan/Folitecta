name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.0.1)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --package folitecta
      - name: The program carries its C runtime
        shell: pwsh
        run: |
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("target/release/folitecta.exe"))
          if ($text -cmatch 'VCRUNTIME140(_1)?\.dll') { Write-Output "::error::The program imports the Visual C++ runtime DLLs again (see .cargo/config.toml)."; exit 1 }
          Write-Output "No import of VCRUNTIME140"
      - name: Package
        shell: pwsh
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $name = "folitecta-$version-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/release/folitecta.exe" "dist/$name/"
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/$name/"
          # The licence notices of the libraries built into the program.
          cargo run --release --locked --package folitecta-notices -- --target x86_64-pc-windows-msvc --out "dist/$name/THIRD-PARTY-LICENSES.txt"
          if ($LASTEXITCODE -ne 0) { throw "the licence notices could not be written" }
          Copy-Item -Recurse docs "dist/$name/docs"
          Copy-Item -Recurse dictionaries "dist/$name/dictionaries"
          Copy-Item -Recurse ocr "dist/$name/ocr"
          # The font for text beyond WinAnsi, without its source (it stays in the source archive).
          Copy-Item -Recurse fonts "dist/$name/fonts"
          Remove-Item -Recurse -Force "dist/$name/fonts/source"
          if (-not (Test-Path "dist/$name/fonts/FreeSans.ttf") -or (Test-Path "dist/$name/fonts/source")) { throw "the fonts folder of the package is wrong" }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          # One line ending in LF, as on the other systems (checkers on macOS refuse CR LF).
          Set-Content -NoNewline -Encoding ascii -Path "dist/$name.zip.sha256" -Value "$hash  $name.zip`n"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.sha256

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - name: Build
        run: cargo build --release --locked --package folitecta
      - name: The program starts without libxdo
        run: |
          readelf -d target/release/folitecta | grep NEEDED
          if readelf -d target/release/folitecta | grep -qi 'libxdo'; then
            echo "::error::The program links libxdo again, so it would not start where libxdo 3 is missing (see crates/libxdo)."
            exit 1
          fi
      - name: Package
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          NAME="folitecta-${VERSION}-linux-x64"
          mkdir -p "dist/${NAME}"
          cp target/release/folitecta "dist/${NAME}/"
          cp README.md LICENSE CHANGELOG.md "dist/${NAME}/"
          # The licence notices of the libraries built into the program.
          cargo run --release --locked --package folitecta-notices -- --target x86_64-unknown-linux-gnu --out "dist/${NAME}/THIRD-PARTY-LICENSES.txt"
          cp -r docs "dist/${NAME}/docs"
          cp -r dictionaries "dist/${NAME}/dictionaries"
          cp -r ocr "dist/${NAME}/ocr"
          # The font for text beyond WinAnsi, without its source (it stays in the source archive).
          cp -r fonts "dist/${NAME}/fonts"
          rm -rf "dist/${NAME}/fonts/source"
          test -f "dist/${NAME}/fonts/FreeSans.ttf" && test ! -e "dist/${NAME}/fonts/source"
          cp crates/folitecta/assets/icon-256.png "dist/${NAME}/folitecta.png"
          cat > "dist/${NAME}/folitecta.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Folitecta
          Comment=Free PDF editor
          Exec=folitecta %F
          Icon=folitecta
          MimeType=application/pdf;
          Categories=Office;Viewer;
          EOF
          sed -i 's/^          //' "dist/${NAME}/folitecta.desktop"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.sha256

  macos:
    name: macOS universal
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --locked --package folitecta --target aarch64-apple-darwin
          cargo build --release --locked --package folitecta --target x86_64-apple-darwin
      - name: Package universal app bundle
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          NAME="folitecta-${VERSION}-macos-universal"
          mkdir -p dist
          lipo -create -output dist/folitecta \
            target/aarch64-apple-darwin/release/folitecta \
            target/x86_64-apple-darwin/release/folitecta
          APP="dist/Folitecta.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/folitecta "$APP/Contents/MacOS/folitecta"
          # The licence of Folitecta and the notices of the libraries built into it.
          cargo run --release --locked --package folitecta-notices -- --target aarch64-apple-darwin --target x86_64-apple-darwin --out dist/THIRD-PARTY-LICENSES.txt
          cp LICENSE dist/THIRD-PARTY-LICENSES.txt "$APP/Contents/Resources/"
          cp -r dictionaries "$APP/Contents/Resources/dictionaries"
          cp -r ocr "$APP/Contents/Resources/ocr"
          cp -r fonts "$APP/Contents/Resources/fonts"
          rm -rf "$APP/Contents/Resources/fonts/source"
          test -f "$APP/Contents/Resources/fonts/FreeSans.ttf" && test ! -e "$APP/Contents/Resources/fonts/source"
          ICONSET=dist/folitecta.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256; do
            sips -z $size $size crates/folitecta/assets/icon-256.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
          done
          cp "$ICONSET/icon_32x32.png" "$ICONSET/icon_16x16@2x.png"
          cp "$ICONSET/icon_64x64.png" "$ICONSET/icon_32x32@2x.png"
          cp "$ICONSET/icon_256x256.png" "$ICONSET/icon_128x128@2x.png"
          rm "$ICONSET/icon_64x64.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/folitecta.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Folitecta</string>
            <key>CFBundleDisplayName</key><string>Folitecta</string>
            <key>CFBundleIdentifier</key><string>io.github.kvasfan.folitecta</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>folitecta</string>
            <key>CFBundleIconFile</key><string>folitecta</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key><array><dict>
              <key>CFBundleTypeName</key><string>PDF document</string>
              <key>CFBundleTypeRole</key><string>Editor</string>
              <key>LSItemContentTypes</key><array><string>com.adobe.pdf</string></array>
            </dict></array>
          </dict></plist>
          EOF
          sed -i '' 's/^          //' "$APP/Contents/Info.plist"
          # An ad hoc signature of the whole bundle (no identity): its program,
          # Info.plist and resources are sealed together, as macOS expects.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --force --sign - dist/folitecta
          (cd dist && ditto -c -k --keepParent Folitecta.app "${NAME}.zip")
          mkdir -p "dist/${NAME}"
          cp dist/folitecta README.md LICENSE CHANGELOG.md dist/THIRD-PARTY-LICENSES.txt "dist/${NAME}/"
          cp -r docs "dist/${NAME}/docs"
          cp -r dictionaries "dist/${NAME}/dictionaries"
          cp -r ocr "dist/${NAME}/ocr"
          # The font for text beyond WinAnsi, without its source (it stays in the source archive).
          cp -r fonts "dist/${NAME}/fonts"
          rm -rf "dist/${NAME}/fonts/source"
          test -f "dist/${NAME}/fonts/FreeSans.ttf" && test ! -e "dist/${NAME}/fonts/source"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.zip" > "${NAME}.zip.sha256" && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256

  release:
    name: Publish GitHub release
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Folitecta ${{ env.RELEASE_TAG }}
          body_path: docs/RELEASE_NOTES.md
          files: artifacts/*
          draft: false
          prerelease: true

  # The same release on GitLab: the Windows and macOS packages go to the
  # generic package registry of the GitLab project, then main and the tag are
  # pushed there, and the tag pipeline (.gitlab-ci.yml) builds Linux and
  # publishes the release. Runs only when the repository has a GITLAB_TOKEN
  # secret (a GitLab access token with the api and write_repository scopes).
  gitlab:
    name: Publish GitLab release
    needs: [release]
    runs-on: ubuntu-latest
    env:
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GITLAB_PROJECT: tirael8308/folitecta
    steps:
      - name: Without a GitLab token
        if: env.GITLAB_TOKEN == ''
        run: echo "::warning::No GITLAB_TOKEN secret, so the GitLab release was not published."
      - uses: actions/checkout@v4
        if: env.GITLAB_TOKEN != ''
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        if: env.GITLAB_TOKEN != ''
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload the Windows and macOS packages
        if: env.GITLAB_TOKEN != ''
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          PROJECT="${GITLAB_PROJECT//\//%2F}"
          for f in artifacts/*windows* artifacts/*macos*; do
            curl --fail --silent --show-error --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
              --upload-file "$f" \
              "https://gitlab.com/api/v4/projects/${PROJECT}/packages/generic/folitecta/${VERSION}/$(basename "$f")"
            echo "uploaded $(basename "$f")"
          done
      - name: Push main and the tag
        if: env.GITLAB_TOKEN != ''
        run: |
          set -euo pipefail
          # The token travels in a header, never in a remote URL.
          AUTH="Authorization: Basic $(printf 'oauth2:%s' "${GITLAB_TOKEN}" | base64 -w0)"
          git fetch origin main
          for ref in "origin/main:refs/heads/main" "refs/tags/${RELEASE_TAG}"; do
            git -c credential.helper= -c "http.https://gitlab.com/.extraHeader=${AUTH}" \
              push "https://gitlab.com/${GITLAB_PROJECT}.git" "$ref"
          done
