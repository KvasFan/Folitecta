[package]
name = "folitecta"
description = "Folitecta - a free PDF editor with a modern Dioxus desktop interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "folitecta"

[[bin]]
name = "folitecta"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
folitecta-core = { path = "../folitecta-core" }
dioxus = { version = "0.7.10", features = ["desktop"] }
rfd = "0.17"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
open = "5"
tokio = { version = "1", features = ["time", "rt", "sync"] }
image.workspace = true
# TLS of the system for the requests to time stamp servers (MIT/Apache-2.0).
native-tls = "0.2"
# The drawings of the interface icons: Tabler Icons (MIT).
icondata_tb = "0.1"
icondata_core = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Devices_ImageAcquisition", "Win32_Foundation", "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Mapi", "Win32_System_Memory", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Security", "Win32_Storage_Xps", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The user id, to check that private folders belong to the user (MIT/Apache-2.0),
# already used by the other dependencies
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The icon, version information and manifest of the Windows program
# (build.rs; MIT).
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# The settings of the web view (hardware acceleration), the version the
# window toolkit uses (MIT).
webkit2gtk = { version = "=2.0.1", features = ["v2_38"] }
