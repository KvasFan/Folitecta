[package]
name = "folitecta"
description = "Folitecta - a free PDF editor with a modern Dioxus desktop interface"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
default-run = "folitecta"

[[bin]]
name = "folitecta"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
folitecta-core = { path = "../folitecta-core" }
dioxus = { version = "0.7.10", features = ["desktop"] }
rfd = "0.17"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
open = "5"
tokio = { version = "1", features = ["time"] }
image.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
