name: CI

# The full check on every platform runs for releases (their tags), for pull
# requests and on demand. Pushes to main are checked before they are made
# (fmt, clippy, the tests and the interface self-test, on Windows), and only
# the larger releases get a tag.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee test-output.txt
      - name: Report failing tests
        if: failure()
        shell: bash
        run: |
          # One annotation per failing test, readable from the run summary.
          awk '/^---- .* stdout ----$/ { if (msg != "") print msg; msg = $0; n = 0; next }
               msg != "" && n < 12 { gsub(/%/, "%25"); msg = msg "%0A" $0; n++ }
               END { if (msg != "") print msg }' test-output.txt | head -n 10 |
            while IFS= read -r m; do echo "::error title=Failing test::$m"; done
      - name: Build
        run: cargo build --workspace
      - name: The Linux program starts without libxdo
        if: runner.os == 'Linux'
        run: |
          readelf -d target/debug/folitecta | grep NEEDED
          if readelf -d target/debug/folitecta | grep -qi 'libxdo'; then
            echo "::error::The program links libxdo again, so it would not start where libxdo 3 is missing (see crates/libxdo)."
            exit 1
          fi
