[workspace]
resolver = "3"
members = ["crates/folitecta-core", "crates/folitecta"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/KvasExpert/Folitecta"
authors = ["KvasExpert"]
rust-version = "1.92"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "0.45"
hayro = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

[workspace.lints.clippy]
collapsible_if = "allow"
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
