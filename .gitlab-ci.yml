# Releases on GitLab. A pushed tag v* builds the Linux package here, stores it
# in the generic package registry of the project (packages do not expire) and
# publishes a release with the Linux, Windows and macOS packages.
#
# The free GitLab plan has no Windows or macOS build machines: the Windows and
# macOS packages are the ones the GitHub release workflow built for the same
# tag (.github/workflows/release.yml), copied to the same registry path
# (packages/generic/folitecta/<version>/) before the tag is pushed here — by
# its gitlab job when the GitHub repository has a GITLAB_TOKEN secret.
# Branch pushes run nothing.

stages: [build, release]

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  PACKAGES: "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/folitecta"

.release-tag:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/'

build-linux:
  extends: .release-tag
  stage: build
  # The oldest system the package must run on (the same as the GitHub builds).
  image: ubuntu:22.04
  timeout: 2h
  cache:
    key: cargo-linux
    paths: [.cargo/registry, .cargo/git, target]
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update
    - apt-get install -y --no-install-recommends curl ca-certificates build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - export PATH="$CARGO_HOME/bin:$PATH"
  script:
    - cargo build --release --locked --package folitecta
    - VERSION="${CI_COMMIT_TAG#v}"
    - NAME="folitecta-${VERSION}-linux-x64"
    - mkdir -p "dist/${NAME}"
    - cp target/release/folitecta README.md LICENSE CHANGELOG.md "dist/${NAME}/"
    - cp -r docs "dist/${NAME}/docs"
    - cp crates/folitecta/assets/icon-256.png "dist/${NAME}/folitecta.png"
    - printf '[Desktop Entry]\nType=Application\nName=Folitecta\nComment=Free PDF editor\nExec=folitecta %%F\nIcon=folitecta\nMimeType=application/pdf;\nCategories=Office;Viewer;\n' > "dist/${NAME}/folitecta.desktop"
    - tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
    - sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
    - 'curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "${NAME}.tar.gz" "$PACKAGES/${VERSION}/${NAME}.tar.gz"'
    - 'curl --fail --silent --show-error --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "${NAME}.tar.gz.sha256" "$PACKAGES/${VERSION}/${NAME}.tar.gz.sha256"'
    - echo "VERSION=${VERSION}" > release.env
  artifacts:
    paths:
      - folitecta-*-linux-x64.tar.gz
      - folitecta-*-linux-x64.tar.gz.sha256
    reports:
      dotenv: release.env
    expire_in: 30 days

release:
  extends: .release-tag
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build-linux
      artifacts: true
  script:
    - echo "Publishing Folitecta $CI_COMMIT_TAG"
  release:
    tag_name: "$CI_COMMIT_TAG"
    name: "Folitecta $CI_COMMIT_TAG"
    description: "./docs/RELEASE_NOTES.md"
    assets:
      links:
        - name: "folitecta-$VERSION-linux-x64.tar.gz"
          url: "$PACKAGES/$VERSION/folitecta-$VERSION-linux-x64.tar.gz"
          link_type: package
        - name: "folitecta-$VERSION-linux-x64.tar.gz.sha256"
          url: "$PACKAGES/$VERSION/folitecta-$VERSION-linux-x64.tar.gz.sha256"
          link_type: other
        - name: "folitecta-$VERSION-windows-x64.zip"
          url: "$PACKAGES/$VERSION/folitecta-$VERSION-windows-x64.zip"
          link_type: package
        - name: "folitecta-$VERSION-windows-x64.zip.sha256"
          url: "$PACKAGES/$VERSION/folitecta-$VERSION-windows-x64.zip.sha256"
          link_type: other
        - name: "folitecta-$VERSION-macos-universal.zip"
          url: "$PACKAGES/$VERSION/folitecta-$VERSION-macos-universal.zip"
          link_type: package
        - name: "folitecta-$VERSION-macos-universal.zip.sha256"
          url: "$PACKAGES/$VERSION/folitecta-$VERSION-macos-universal.zip.sha256"
          link_type: other
        - name: "folitecta-$VERSION-macos-universal.tar.gz"
          url: "$PACKAGES/$VERSION/folitecta-$VERSION-macos-universal.tar.gz"
          link_type: package
        - name: "folitecta-$VERSION-macos-universal.tar.gz.sha256"
          url: "$PACKAGES/$VERSION/folitecta-$VERSION-macos-universal.tar.gz.sha256"
          link_type: other
