name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (for example v0.0.1), or a branch to build only"
        required: true
      publish:
        description: "Publish the release (off: the packages stay as artifacts of the run, a check before a tag)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Cross-platform checks
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Resolve package version
        shell: bash
        run: python3 packaging/version.py
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --package folitecta
      - name: The program carries its C runtime
        shell: pwsh
        run: |
          $text = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes("target/release/folitecta.exe"))
          if ($text -cmatch 'VCRUNTIME140(_1)?\.dll') { Write-Output "::error::The program imports the Visual C++ runtime DLLs again (see .cargo/config.toml)."; exit 1 }
          Write-Output "No import of VCRUNTIME140"
      - name: Package
        shell: pwsh
        run: |
          $version = $env:PACKAGE_VERSION
          $name = "folitecta-$version-windows-x64"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/release/folitecta.exe" "dist/$name/"
          Copy-Item README.md, LICENSE, CHANGELOG.md "dist/$name/"
          # The licence notices of the libraries built into the program.
          cargo run --release --locked --package folitecta-notices -- --target x86_64-pc-windows-msvc --out "dist/$name/THIRD-PARTY-LICENSES.txt"
          if ($LASTEXITCODE -ne 0) { throw "the licence notices could not be written" }
          Copy-Item -Recurse docs "dist/$name/docs"
          Copy-Item -Recurse dictionaries "dist/$name/dictionaries"
          Copy-Item -Recurse ocr "dist/$name/ocr"
          # The font for text beyond WinAnsi, without its source (it stays in the source archive).
          Copy-Item -Recurse fonts "dist/$name/fonts"
          Remove-Item -Recurse -Force "dist/$name/fonts/source"
          if (-not (Test-Path "dist/$name/fonts/FreeSans.ttf") -or (Test-Path "dist/$name/fonts/source")) { throw "the fonts folder of the package is wrong" }
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"
          $hash = (Get-FileHash "dist/$name.zip" -Algorithm SHA256).Hash.ToLower()
          # One line ending in LF, as on the other systems (checkers on macOS refuse CR LF).
          Set-Content -NoNewline -Encoding ascii -Path "dist/$name.zip.sha256" -Value "$hash  $name.zip`n"
      - name: Build Windows installer
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          $version = $env:PACKAGE_VERSION
          $payload = (Resolve-Path "dist/folitecta-$version-windows-x64").Path
          & "${env:ProgramFiles(x86)}/NSIS/makensis.exe" "/DVERSION=$version" "/DPAYLOAD=$payload" packaging/windows/folitecta.nsi
          if ($LASTEXITCODE -ne 0) { throw "NSIS failed" }
          $file = "folitecta-$version-windows-x64-setup.exe"
          $hash = (Get-FileHash "dist/$file" -Algorithm SHA256).Hash.ToLower()
          Set-Content -NoNewline -Encoding ascii "dist/$file.sha256" "$hash  $file`n"
      - name: Verify installer and uninstaller
        shell: pwsh
        run: |
          $version = $env:PACKAGE_VERSION
          $install = Join-Path $env:RUNNER_TEMP "Folitecta install test"
          $process = Start-Process "dist/folitecta-$version-windows-x64-setup.exe" -ArgumentList '/S',"/D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or -not (Test-Path "$install/folitecta.exe")) { throw "Installation failed" }
          $actual = & "$install/folitecta.exe" --version
          if ($actual -notmatch [regex]::Escape($version)) { throw "Installed version mismatch: $actual" }
          $process = Start-Process "$install/Uninstall.exe" -ArgumentList '/S',"_?=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0 -or (Test-Path "$install/folitecta.exe")) { throw "Uninstall failed" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256

  linux:
    name: Linux x64
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Resolve package version
        shell: bash
        run: python3 packaging/version.py
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config
      - name: Build
        run: cargo build --release --locked --package folitecta
      - name: The program starts without libxdo
        run: |
          readelf -d target/release/folitecta | grep NEEDED
          if readelf -d target/release/folitecta | grep -qi 'libxdo'; then
            echo "::error::The program links libxdo again, so it would not start where libxdo 3 is missing (see crates/libxdo)."
            exit 1
          fi
      - name: Package
        run: |
          set -euo pipefail
          VERSION="$PACKAGE_VERSION"
          NAME="folitecta-${VERSION}-linux-x64"
          mkdir -p "dist/${NAME}"
          cp target/release/folitecta "dist/${NAME}/"
          cp README.md LICENSE CHANGELOG.md "dist/${NAME}/"
          # The licence notices of the libraries built into the program.
          cargo run --release --locked --package folitecta-notices -- --target x86_64-unknown-linux-gnu --out "dist/${NAME}/THIRD-PARTY-LICENSES.txt"
          cp -r docs "dist/${NAME}/docs"
          cp -r dictionaries "dist/${NAME}/dictionaries"
          cp -r ocr "dist/${NAME}/ocr"
          # The font for text beyond WinAnsi, without its source (it stays in the source archive).
          cp -r fonts "dist/${NAME}/fonts"
          rm -rf "dist/${NAME}/fonts/source"
          test -f "dist/${NAME}/fonts/FreeSans.ttf" && test ! -e "dist/${NAME}/fonts/source"
          cp crates/folitecta/assets/icon-256.png "dist/${NAME}/folitecta.png"
          cat > "dist/${NAME}/folitecta.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Folitecta
          Comment=Free PDF editor
          Exec=folitecta %F
          Icon=folitecta
          MimeType=application/pdf;
          Categories=Office;Viewer;
          EOF
          sed -i 's/^          //' "dist/${NAME}/folitecta.desktop"
          cp packaging/linux/install.sh "dist/${NAME}/install.sh"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
      - name: Build and verify Debian installer
        run: |
          VERSION="$PACKAGE_VERSION"
          packaging/linux/build-deb.sh "dist/folitecta-${VERSION}-linux-x64" "$VERSION" "dist/folitecta-${VERSION}-linux-amd64.deb"
          sudo apt-get install -y "./dist/folitecta-${VERSION}-linux-amd64.deb"
          folitecta --version | grep -F "$VERSION"
          test -f /opt/folitecta/fonts/FreeSans.ttf
          test -f /usr/share/applications/folitecta.desktop
          sudo apt-get remove -y folitecta
          test ! -e /usr/bin/folitecta
          (cd dist && sha256sum "folitecta-${VERSION}-linux-amd64.deb" > "folitecta-${VERSION}-linux-amd64.deb.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.sha256

  macos:
    name: macOS universal
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Resolve package version
        shell: bash
        run: python3 packaging/version.py
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build both architectures
        run: |
          cargo build --release --locked --package folitecta --target aarch64-apple-darwin
          cargo build --release --locked --package folitecta --target x86_64-apple-darwin
      - name: Package universal app bundle
        run: |
          set -euo pipefail
          VERSION="$PACKAGE_VERSION"
          NAME="folitecta-${VERSION}-macos-universal"
          mkdir -p dist
          lipo -create -output dist/folitecta \
            target/aarch64-apple-darwin/release/folitecta \
            target/x86_64-apple-darwin/release/folitecta
          APP="dist/Folitecta.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp dist/folitecta "$APP/Contents/MacOS/folitecta"
          # The licence of Folitecta and the notices of the libraries built into it.
          cargo run --release --locked --package folitecta-notices -- --target aarch64-apple-darwin --target x86_64-apple-darwin --out dist/THIRD-PARTY-LICENSES.txt
          cp LICENSE dist/THIRD-PARTY-LICENSES.txt "$APP/Contents/Resources/"
          cp -r dictionaries "$APP/Contents/Resources/dictionaries"
          cp -r ocr "$APP/Contents/Resources/ocr"
          cp -r fonts "$APP/Contents/Resources/fonts"
          rm -rf "$APP/Contents/Resources/fonts/source"
          test -f "$APP/Contents/Resources/fonts/FreeSans.ttf" && test ! -e "$APP/Contents/Resources/fonts/source"
          ICONSET=dist/folitecta.iconset
          mkdir -p "$ICONSET"
          for size in 16 32 64 128 256; do
            sips -z $size $size crates/folitecta/assets/icon-256.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null
          done
          cp "$ICONSET/icon_32x32.png" "$ICONSET/icon_16x16@2x.png"
          cp "$ICONSET/icon_64x64.png" "$ICONSET/icon_32x32@2x.png"
          cp "$ICONSET/icon_256x256.png" "$ICONSET/icon_128x128@2x.png"
          rm "$ICONSET/icon_64x64.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/folitecta.icns"
          cat > "$APP/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>Folitecta</string>
            <key>CFBundleDisplayName</key><string>Folitecta</string>
            <key>CFBundleIdentifier</key><string>io.github.kvasfan.folitecta</string>
            <key>CFBundleVersion</key><string>${VERSION}</string>
            <key>CFBundleShortVersionString</key><string>${VERSION}</string>
            <key>CFBundleExecutable</key><string>folitecta</string>
            <key>CFBundleIconFile</key><string>folitecta</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>CFBundleDocumentTypes</key><array><dict>
              <key>CFBundleTypeName</key><string>PDF document</string>
              <key>CFBundleTypeRole</key><string>Editor</string>
              <key>LSItemContentTypes</key><array><string>com.adobe.pdf</string></array>
            </dict></array>
          </dict></plist>
          EOF
          sed -i '' 's/^          //' "$APP/Contents/Info.plist"
          # An ad hoc signature of the whole bundle (no identity): its program,
          # Info.plist and resources are sealed together, as macOS expects.
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --force --sign - dist/folitecta
          (cd dist && ditto -c -k --keepParent Folitecta.app "${NAME}.zip")
          mkdir -p "dist/${NAME}"
          cp dist/folitecta README.md LICENSE CHANGELOG.md dist/THIRD-PARTY-LICENSES.txt "dist/${NAME}/"
          cp -r docs "dist/${NAME}/docs"
          cp -r dictionaries "dist/${NAME}/dictionaries"
          cp -r ocr "dist/${NAME}/ocr"
          # The font for text beyond WinAnsi, without its source (it stays in the source archive).
          cp -r fonts "dist/${NAME}/fonts"
          rm -rf "dist/${NAME}/fonts/source"
          test -f "dist/${NAME}/fonts/FreeSans.ttf" && test ! -e "dist/${NAME}/fonts/source"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          (cd dist && shasum -a 256 "${NAME}.zip" > "${NAME}.zip.sha256" && shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256")
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Resolve package version
        shell: bash
        run: python3 packaging/version.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE" || { echo '::error::Missing Android release signing key'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/folitecta.keystore"
      - name: Build, lint and verify signed release
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/folitecta.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION="$PACKAGE_VERSION"
          sdkmanager "build-tools;35.0.0" "platforms;android-35"
          cd android
          ./gradlew --no-daemon assembleRelease lint -PreleaseVersion="$VERSION"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/folitecta-${VERSION}-android.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "../dist/folitecta-${VERSION}-android.apk"
          (cd ../dist && sha256sum "folitecta-${VERSION}-android.apk" > "folitecta-${VERSION}-android.apk.sha256")
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/folitecta.keystore"
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: |
            dist/*.apk
            dist/*.sha256

  release:
    name: Publish GitHub release
    needs: [checks, windows, linux, macos, android]
    if: github.event_name == 'push' || (inputs.publish && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -la artifacts
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Folitecta ${{ env.RELEASE_TAG }}
          body_path: docs/RELEASE_NOTES.md
          files: artifacts/*
          draft: false
          prerelease: true
